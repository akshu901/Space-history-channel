name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o .github/workflows/youtube-automation-phase2.zip
          cp -r youtube-automation/. .
          rm -rf youtube-automation .github/workflows/youtube-automation-phase2.zip
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Add project" || echo nothing
          git push
