name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -R . | head -50
          ZIP=$(find . -name "youtube-automation*.zip" -not -path "./.git/*" | head -1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP"
          cp -r youtube-automation/. .
          rm -rf youtube-automation "$ZIP"
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Add project" || echo nothing
          git push
